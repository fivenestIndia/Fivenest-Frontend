<!DOCTYPE html>
<html>
<head>
    <script src="index.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <div class="top-header">
        <div class="version-tag">STARTER V1.0</div>
        <button id="btnThemeToggle" class="theme-switch" title="Toggle Dark/Light Mode">☀</button>
    </div>

    <div class="tabs">
        <button id="tabRun" class="tab-btn active">Run Engine</button>
        <button id="tabEdit" class="tab-btn">Size Editor</button>
    </div>

    <div id="panelRun" class="panel active">
        
        <div class="box" id="licensingBox" style="border-left: 3px solid var(--accent-color); padding: 4px 6px; margin-bottom: 3px;">
            <div class="box-header-row" style="display: flex; justify-content: space-between; margin-bottom: 0px; border-bottom: none;">
                <div class="header-small">License Registration</div>
                <div style="display: flex; align-items: center; gap: 4px;">
                    <div id="licenseStatus" style="font-size: 9px; font-weight: bold; color: #ff3b30;">Checking...</div>
                    <button id="btnManageLicense" class="btn-tiny-action hidden-control" style="font-size: 8px; color: var(--accent-color); padding: 0 2px;">[MANAGE]</button>
                </div>
            </div>
            <div id="licenseContent">
                <div class="row-tiny" style="display:flex; flex-direction:column; gap:4px; margin-top: 4px; border-top: 1px solid var(--border-color); padding-top: 4px;">
                    <input type="text" id="txtLicenseEmail" placeholder="Enter Registration Email" style="width: 100%; height:18px; text-align: center; margin-bottom: 3px; background: #222; border: 1px solid #444; color: #fff; padding: 0 4px;">
                    <div style="display:flex; width:100%; gap:4px;">
                        <input type="text" id="txtLicenseKey" placeholder="Enter License Key" style="flex: 1; height:18px; text-align: center; background: #222; border: 1px solid #444; color: #fff; padding: 0 4px;">
                        <button id="btnActivate" class="btn-tiny-action" style="font-size: 10px; padding: 1px 6px;">ACTIVATE</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="box">
            <div class="box-header-row">
                <div class="header-small">1. Input Files</div>
                <button id="btnValidate" class="btn-tiny-action">🔍 CHECK CSV</button>
            </div>
            <div style="display: flex; width: 100%; gap: 6px;">
                <div style="flex: 1; min-width: 0;">
                    <button id="btnCSV" class="picker-btn" style="width: 100%;">Select CSV</button>
                    <div id="lblCSV" class="status-tiny" style="margin-top: 2px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9px;">None</div>
                </div>
                <div style="flex: 1; min-width: 0;">
                    <button id="btnFolder" class="picker-btn" style="width: 100%;">Select Output</button>
                    <div id="lblFolder" class="status-tiny" style="margin-top: 2px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9px;">None</div>
                </div>
            </div>
        </div>

        <div class="box">
            <div class="box-header-row">
                <div style="display:flex; align-items:center;">
                    <span id="btnToggleConfig" class="toggle-icon">▼</span>
                    <div class="header-small">2. Configuration</div>
                </div>
                <button id="btnSetDefault" class="btn-tiny-action" title="Save current settings as default">SET DEFAULT</button>
            </div>

            <div id="configContent">
                <div class="row-tiny" style="margin-bottom: 2px;">
                    <span style="font-size: 9px;">Format:</span>
                    <select id="exportFormat" style="width: 50px;">
                        <option value="jpg">JPG</option>
                        <option value="png">PNG</option>
                        <option value="tiff">TIFF</option>
                    </select>
                    <span style="margin-left: auto; margin-right: 4px; font-size: 9px;">Res:</span>
                    <input type="number" id="resolution" value="300" style="width: 36px; padding: 0 2px;">
                </div>

                <div class="row-tiny" style="justify-content: flex-start; margin-bottom: 2px;">
                    <div class="checkbox-item" id="containerEmbed" style="margin-right: 15px;">
                        <input type="checkbox" id="chkEmbedProfile" checked>
                        <span id="lblEmbed">Embed Profile</span>
                    </div>
                    <div class="checkbox-item hidden-control" id="containerLZW">
                        <input type="checkbox" id="chkLZW">
                        <span>LZW Comp.</span>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px; border-top: 1px solid #444; padding-top: 4px; width: 100%;">
                    <div style="display: flex; align-items: center;">
                        <span style="font-size: 9px; margin-right: 4px;">Name Max:</span>
                        <input type="number" id="limitName" value="11" style="width: 30px; padding: 0 2px; text-align: center;">
                    </div>
                    <div style="display: flex; align-items: center;">
                        <span style="font-size: 9px; margin-right: 4px;">Num Max:</span>
                        <input type="number" id="limitNum" value="9" style="width: 30px; padding: 0 2px; text-align: center;">
                    </div>
                </div>
            </div>
        </div>
        
        <button id="btnRun" class="btn-main">▶ RUN AUTOMATION</button>

        <div class="progress-container">
            <div id="progressBar"></div>
            <div class="progress-text" id="progressVal">0%</div>
        </div>
        <div id="etaDisplay" class="eta-text">Remaining: --:--</div>
        
        <div id="workCaption" class="caption-anim hidden-control">Optimizing workflow efficiency...</div>

        <div class="log-header">
            <div class="log-title">Process Log</div>
            <button id="btnClearLog" class="btn-tiny-action">Clear Log</button>
        </div>
        <div id="logArea">Ready.</div>
    </div>

    <div id="panelEdit" class="panel">
        <div class="box" style="margin-bottom: 6px;">
            <div class="row-tiny"><span>Size:</span><select id="sizeSelector" style="width: 100%;"></select></div>
        </div>
        <div class="box">
            <div class="header-small" style="margin-bottom: 8px;">Dimensions (in)</div>
            <div class="row-tiny"><span style="font-size: 9px;">Front:</span> <div><input type="number" id="frontW" class="size-input"> x <input type="number" id="frontH" class="size-input"></div></div>
            <div class="row-tiny"><span style="font-size: 9px;">Back:</span> <div><input type="number" id="backW" class="size-input"> x <input type="number" id="backH" class="size-input"></div></div>
            <div class="row-tiny"><span style="font-size: 9px;">Half:</span> <div><input type="number" id="halfW" class="size-input"> x <input type="number" id="halfH" class="size-input"></div></div>
            <div class="row-tiny"><span style="font-size: 9px;">Full:</span> <div><input type="number" id="fullW" class="size-input"> x <input type="number" id="fullH" class="size-input"></div></div>
            
            <button id="btnSaveDB" class="btn-save">Save Database</button>
            <div id="saveMsg" class="status-tiny"></div>
        </div>
    </div>
</body>
</html>
